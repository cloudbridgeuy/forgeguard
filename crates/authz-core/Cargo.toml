[package]
name = "forgeguard_authz_core"
version = "0.2.0"
homepage = "https://github.com/cloudbridgeuy/forgeguard"
description = "Authorization domain types, Cedar policy types, and permission definitions (pure). Internal dep — use forgeguard-axum for the public API."
autobins = false

authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "forgeguard_authz_core"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
cedar-policy = { workspace = true }
forgeguard_core = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
