[package]
name = "forgeguard_authn"
version = "0.0.0"
publish = false
homepage = "https://github.com/cloudbridgeuy/forgeguard"
description = "Authentication I/O — Cognito adapter, SES/SNS side effects"
autobins = false

authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "forgeguard_authn"
path = "src/lib.rs"

[features]
# Exposes the `arm_*_once` failure-injection knobs on `InMemoryUserPoolClient`
# to downstream test builds (e.g. `forgeguard_control_plane` handler tests).
testing = []

[dependencies]
forgeguard_core = { workspace = true }
forgeguard_authn_core = { workspace = true }
async-trait = { workspace = true }
aws-sdk-cognitoidentityprovider = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
