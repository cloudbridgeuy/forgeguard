[package]
name = "xtask"
version = "0.1.0"
publish = false
license = "MIT"
edition = "2021"

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
forgeguard_authz_core = { workspace = true }
aws-config = { workspace = true }
aws-sdk-cloudformation = { workspace = true }
aws-sdk-cognitoidentityprovider = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-lambda = { workspace = true }
aws-sdk-verifiedpermissions = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
chrono = { workspace = true }
duct = "1.1.0"
ed25519-dalek = { workspace = true }
libc = { workspace = true }
glob = "0.3"
owo-colors = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
forgeguard_authn_core = { workspace = true }

[features]
# Enables `cargo test -p xtask --features dynamodb-tests`, which spins up the
# seed-shell integration cases against a `dynamodb-local` instance. Driven by
# `cargo xtask control-plane test`; needs `DYNAMODB_ENDPOINT` set to the local
# endpoint (or defaults to `http://localhost:8000`).
dynamodb-tests = []
