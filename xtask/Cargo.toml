[package]
name = "xtask"
version = "0.1.0"
publish = false
license = "MIT"
edition = "2021"

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# `forgeguard_authn_core` is a pure leaf crate (CLAUDE.md xtask-dep exception).
forgeguard_authn_core = { workspace = true }
# `forgeguard_core` is a pure leaf crate (CLAUDE.md xtask-dep exception) — needed
# for the typed IDs (`UserId`, `OrganizationId`, `GroupName`) carried on the
# membership row the V6 seed writes.
forgeguard_core = { workspace = true }
# `forgeguard_authn` is an I/O crate — a pragmatic expansion of the xtask-dep
# policy (issue #100 V6 §7). It carries the Cognito `UserPoolClient` the seed
# needs; no Axum, no handler tree — cost comparable to the AWS SDK deps below.
forgeguard_authn = { workspace = true }
forgeguard_authz_core = { workspace = true }
aws-config = { workspace = true }
aws-sdk-cloudformation = { workspace = true }
aws-sdk-cognitoidentityprovider = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-lambda = { workspace = true }
aws-sdk-verifiedpermissions = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
chrono = { workspace = true }
duct = "1.1.0"
ed25519-dalek = { workspace = true }
libc = { workspace = true }
glob = "0.3"
owo-colors = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }
zip = { workspace = true }

[features]
# Enables `cargo test -p xtask --features dynamodb-tests`, which spins up the
# seed-shell integration cases against a `dynamodb-local` instance. Driven by
# `cargo xtask control-plane test`; needs `DYNAMODB_ENDPOINT` set to the local
# endpoint (or defaults to `http://localhost:8000`).
dynamodb-tests = []
